<template>
    <lightning-card title="Contact Manager" icon-name="standard:contact_list">
        <div slot="actions">
            <lightning-button
                label={formButtonLabel}
                variant="brand"
                onclick={toggleForm}>
            </lightning-button>
        </div>

        <div class="slds-p-around_medium">
            <template if:true={showForm}>
                <div class="slds-box slds-m-bottom_medium">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">New Contact</h3>
                    <lightning-input label="First Name" data-field="firstName" value={firstName} onchange={handleInputChange}></lightning-input>
                    <lightning-input label="Last Name" data-field="lastName" value={lastName} onchange={handleInputChange} required></lightning-input>
                    <lightning-input label="Email" type="email" data-field="email" value={email} onchange={handleInputChange}></lightning-input>
                    <lightning-input label="Phone" type="tel" data-field="phone" value={phone} onchange={handleInputChange}></lightning-input>
                    <div class="slds-m-top_small">
                        <lightning-button label="Save Contact" variant="success" onclick={handleCreate}></lightning-button>
                    </div>
                </div>
            </template>

            <template if:true={error}>
                <div class="slds-box slds-theme_error slds-m-bottom_medium">
                    <p>{error}</p>
                </div>
            </template>

            <template if:true={contacts.length}>
                <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                    <thead>
                        <tr>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={contacts} for:item="contact">
                            <tr key={contact.Id}>
                                <td>{contact.FirstName}</td>
                                <td>{contact.LastName}</td>
                                <td>{contact.Email}</td>
                                <td>{contact.Phone}</td>
                                <td>
                                    <lightning-button-icon
                                        icon-name="utility:delete"
                                        variant="destructive"
                                        data-id={contact.Id}
                                        onclick={handleDelete}
                                        alternative-text="Delete">
                                    </lightning-button-icon>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

            <template if:false={contacts.length}>
                <p class="slds-text-body_regular slds-text-color_weak">No contacts found. Add one above!</p>
            </template>
        </div>
    </lightning-card>
</template>
