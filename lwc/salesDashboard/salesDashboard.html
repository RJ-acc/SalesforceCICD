<template>
    <lightning-card title="Sales Dashboard" icon-name="standard:dashboard">
        <div class="slds-p-around_medium">
            <template if:true={isLoading}><lightning-spinner alternative-text="Loading"></lightning-spinner></template>
            <template if:false={isLoading}>
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-3 slds-m-bottom_medium"><div class="slds-box slds-theme_shade"><p class="slds-text-title_caps">Accounts</p><p class="slds-text-heading_large">{totalAccounts}</p></div></div>
                    <div class="slds-col slds-size_1-of-3 slds-m-bottom_medium"><div class="slds-box slds-theme_shade"><p class="slds-text-title_caps">Contacts</p><p class="slds-text-heading_large">{totalContacts}</p></div></div>
                    <div class="slds-col slds-size_1-of-3 slds-m-bottom_medium"><div class="slds-box slds-theme_shade"><p class="slds-text-title_caps">Open Opps</p><p class="slds-text-heading_large">{totalOpportunities}</p></div></div>
                    <div class="slds-col slds-size_1-of-3 slds-m-bottom_medium"><div class="slds-box slds-theme_shade"><p class="slds-text-title_caps">Open Cases</p><p class="slds-text-heading_large">{openCases}</p></div></div>
                    <div class="slds-col slds-size_1-of-3 slds-m-bottom_medium"><div class="slds-box slds-theme_shade"><p class="slds-text-title_caps">Pipeline</p><p class="slds-text-heading_medium">{pipelineValue}</p></div></div>
                    <div class="slds-col slds-size_1-of-3 slds-m-bottom_medium"><div class="slds-box slds-theme_shade"><p class="slds-text-title_caps">Won</p><p class="slds-text-heading_medium">{closedWonValue}</p></div></div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
